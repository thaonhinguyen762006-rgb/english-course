<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiếng Anh giao tiếp</title>
<style>body{font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding:32px 18px;background:#f6f7fb;color:#1d2433}
a.l{display:block;background:#fff;border:1px solid #dfe3ee;border-radius:12px;padding:16px;margin:12px 0;color:#2557d6;text-decoration:none;font-weight:600}
.n{font-size:14px;opacity:.75}
@media (prefers-color-scheme:dark){body{background:#12151d;color:#eef1f8}a.l{background:#1b2030;border-color:#2d3550;color:#7ea2ff}}</style></head>
<body><h1>Tiếng Anh giao tiếp</h1><p>Chọn buổi học:</p><div id="list">Đang tải danh sách…</div>
<p class="n">Nghe audio: mở bằng Chrome hoặc Safari, tắt chế độ im lặng, tăng âm lượng.</p>
<script>
(async function(){
var box=document.getElementById("list"),base=location.pathname.replace(/[^\/]*$/,""),user=location.hostname.split(".")[0],repo=base.split("/").filter(Boolean)[0]||"",nums=[];
try{var r=await fetch("https://api.github.com/repos/"+user+"/"+repo+"/contents/");if(!r.ok)throw 0;(await r.json()).forEach(function(f){var m=/^buoi(\d+)\.html$/.exec(f.name);if(m)nums.push(+m[1])})}catch(e){nums=[]}
if(!nums.length){for(var n=1;n<=60;n++){try{var h=await fetch("buoi"+n+".html",{method:"HEAD"});if(!h.ok)break;nums.push(n)}catch(e){break}}}
nums.sort(function(a,b){return a-b});
if(!nums.length){box.textContent="Chưa có buổi học nào.";return}
box.innerHTML="";
for(var i=0;i<nums.length;i++){var k=nums[i],label="Buổi "+k;
try{var t=await (await fetch("buoi"+k+".html")).text(),m=/<title>([^<]*)<\/title>/.exec(t);if(m){var ta=document.createElement("textarea");ta.innerHTML=m[1];label=ta.value.replace(/^.*?(Buổi\s*\d+)/,"$1")}}catch(e){}
var a=document.createElement("a");a.className="l";a.href="buoi"+k+".html";a.textContent=label;box.appendChild(a)}
})();
</script></body></html>
